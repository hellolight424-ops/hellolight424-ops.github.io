<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Game Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <h1>Mijn Game Shop</h1>
  <button class="login">Login</button>
</header>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h3>Categorieën</h3>
  <a class="active" onclick="showCategory('coins')">Coins</a>
  <a onclick="showCategory('staff')">Staff</a>
  <a onclick="showCategory('ranks')">Ranks</a>
  <a onclick="showCategory('unbans')">Unbans</a>
  <a onclick="showCategory('extra')">Extra</a>
  <a onclick="showCategory('giftcards')">Giftcards</a>
  <a onclick="showCategory('stunt')">Stunt Pakketten</a>
</aside>

<!-- CONTENT -->
<main class="content">

<!-- COINS -->
<div id="coins" class="category">
<h2>Coins</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>5 Coins</h3><p class="price">€5</p><button>Kopen</button></div>
  <div class="product"><img src="https://via.placeholder.com/300"><h3>15 Coins</h3><p class="price">€12</p><button>Kopen</button></div>
</div>
</div>

<!-- STAFF -->
<div id="staff" class="category hidden">
<h2>Staff</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>Helper Rank</h3><p class="price">€10</p><button>Kopen</button></div>
</div>
</div>

<!-- RANKS -->
<div id="ranks" class="category hidden">
<h2>Ranks</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>VIP</h3><p class="price">€5</p><button>Kopen</button></div>
  <div class="product"><img src="https://via.placeholder.com/300"><h3>Elite</h3><p class="price">€15</p><button>Kopen</button></div>
</div>
</div>

<!-- UNBANS -->
<div id="unbans" class="category hidden">
<h2>Unbans</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>Unban</h3><p class="price">€7</p><button>Kopen</button></div>
</div>
</div>

<!-- EXTRA -->
<div id="extra" class="category hidden">
<h2>Extra</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>Naamkleur</h3><p class="price">€3</p><button>Kopen</button></div>
</div>
</div>

<!-- GIFTCARDS -->
<div id="giftcards" class="category hidden">
<h2>Giftcards</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>€10 Giftcard</h3><p class="price">€10</p><button>Kopen</button></div>
</div>
</div>

<!-- STUNT -->
<div id="stunt" class="category hidden">
<h2>Stunt Pakketten</h2>
<div class="products">
  <div class="product"><img src="https://via.placeholder.com/300"><h3>Starter Pack</h3><p class="price">€20</p><button>Kopen</button></div>
</div>
</div>

</main>
</div>

<script>
function showCategory(id){
  document.querySelectorAll('.category').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');

  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
}
</script>

</body>
</html>
