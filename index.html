<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Shop</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:30px;
}

.product{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.product img{
  width:100%;
  border-radius:10px;
}

button{
  margin-top:10px;
  padding:10px 20px;
  background:#4f46e5;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>Mijn Shop</h1>
<p>Welkom in mijn webshop</p>
</header>

<section class="products">

<div class="product">
<img src="https://via.placeholder.com/200">
<h3>T-shirt</h3>
<p>€19,99</p>
<button>Bestel</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/200">
<h3>Pet</h3>
<p>€14,99</p>
<button>Bestel</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/200">
<h3>Schoenen</h3>
<p>€49,99</p>
<button>Bestel</button>
</div>

</section>

</body>
</html>
