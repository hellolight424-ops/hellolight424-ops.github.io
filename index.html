<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Game Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <h1>Mijn Game Shop</h1>
  <button class="login">Login</button>
</header>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h3>Categorieën</h3>
  <a class="active" href="#">Coins</a>
  <a href="#">Ranks</a>
  <a href="#">Unbans</a>
  <a href="#">Extra</a>
  <a href="#">Giftcards</a>
</aside>

<!-- CONTENT -->
<main class="content">
  <h2>Coins</h2>
  <p>Gebruik coins om items te kopen in de store.</p>

  <div class="products">

    <div class="product">
      <img src="https://via.placeholder.com/300">
      <h3>1 Coin</h3>
      <p class="price">€2.50</p>
      <button>Kopen</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300">
      <h3>5 Coins</h3>
      <p class="price">€10.00</p>
      <button>Kopen</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300">
      <h3>15 Coins</h3>
      <p class="price">€25.00</p>
      <button>Kopen</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300">
      <h3>35 Coins</h3>
      <p class="price">€50.00</p>
      <button>Kopen</button>
    </div>

  </div>
</main>

</div>

</body>
</html>
